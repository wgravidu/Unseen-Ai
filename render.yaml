# UNSEEN AI — one-click Blueprint for Render (free tier)
# In Render: New > Blueprint > select this repo. Then set MODEL_API_KEY on the
# unseen-ai-backend service (Dashboard > Environment) — the value is never stored in Git.
#
# How it connects: the frontend is served from unseen-ai-frontend.onrender.com and
# calls https://unseen-ai-backend.onrender.com directly (VITE_API_BASE_URL below).
# CORS allows only that exact frontend origin (plus local dev origins added by the
# backend's LAN regex). Do NOT widen this to '*': with credentials disabled any
# website could spend the demo's API credits from a visitor's browser. The real
# credit protection is the backend rate limiting (per-IP + global hourly ceiling).

services:
  - type: web
    name: unseen-ai-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_BASE_URL
        value: https://api.meta.ai/v1
      - key: MODEL_NAME
        value: muse-spark-1.3
      - key: CORS_ORIGINS
        value: "https://unseen-ai-frontend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.2"

  - type: web
    name: unseen-ai-frontend
    env: static
    rootDir: unseen-ai
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://unseen-ai-backend.onrender.com
      - key: VITE_HTTPS
        value: "false"
      - key: NODE_VERSION
        value: "24"
